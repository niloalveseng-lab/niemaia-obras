<style>
/* =========================================================
   NIEMAIA – Gestão de Obras · design system enxuto
   Cor primária: laranja NIEMAIA sóbrio (#C2410C, AA 5,2:1 com branco).
   Espaçamento em múltiplos de 4 px. 1 fonte (Inter). Tema claro e escuro.
   ========================================================= */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r1:6px;--r2:8px;--r3:12px;--rf:999px;
  --t:180ms cubic-bezier(.2,.7,.3,1);
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-io:cubic-bezier(0.77,0,0.175,1);
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:var(--fb);
  /* claro */
  --fun:#F4F5F7;--sup:#FFFFFF;--sup2:#F8F9FB;--hov:#F1F3F5;--neu:#ECEEF1;
  --lin:#E2E5E9;--lin2:#EEF0F3;--lin-forte:#CDD1D7;
  --txt:#1D1F23;--txt2:#3E4148;--sec:#5F636B;--mut:#6A6E77;
  --lar:#C2410C;--lar2:#9A3412;--larf:#FFF1EA;--on-pri:#FFFFFF;--marca:#F95414;--link:#C2410C;
  --graf:#26272B;
  --ok:#15703F;--okf:#E6F4EC;--av:#8A5300;--avf:#FFF3D6;--er:#B42318;--erf:#FDECEA;--er-borda:#F1C4BE;--az:#1D5FA8;--azf:#E8F0FA;
  --sh1:0 1px 2px rgba(16,24,40,.06);--sh2:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.05);--sh3:0 16px 40px rgba(16,24,40,.18);
  --foco:0 0 0 3px rgba(194,65,12,.28);
  color-scheme:light;
}
[data-tema="escuro"]{
  --fun:#121316;--sup:#1A1B1F;--sup2:#202126;--hov:#25272C;--neu:#2A2C32;
  --lin:#2E3036;--lin2:#26282D;--lin-forte:#3C3F46;
  --txt:#E6E7EA;--txt2:#C9CBD0;--sec:#A3A7AF;--mut:#8C9099;
  --lar:#F26B2A;--lar2:#FF8A4C;--larf:#3A2116;--on-pri:#16171A;--link:#FF8A4C;
  --graf:#0D0E10;
  --ok:#4CC38A;--okf:#163326;--av:#F0B44C;--avf:#3A2C12;--er:#FF6B5E;--erf:#3D1A17;--er-borda:#6B2A24;--az:#6EA8F0;--azf:#172A42;
  --sh1:none;--sh2:0 1px 0 rgba(255,255,255,.03);--sh3:0 16px 40px rgba(0,0,0,.5);
  --foco:0 0 0 3px rgba(242,107,42,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:14.5px/1.5 var(--fb);color:var(--txt);background:var(--fun);-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.01em;color:var(--txt)}
h1{font-size:24px;margin:0 0 2px;line-height:1.2}h2{font-size:18px;margin:16px 0 8px}h3{font-size:15.5px;margin:12px 0 8px}
a{color:var(--link)}
code{background:var(--neu);padding:1px 6px;border-radius:var(--r1);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* botões e campos */
button{border:1px solid var(--lin);background:var(--sup);border-radius:var(--r2);padding:0 var(--s3);height:36px;cursor:pointer;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background var(--t),border-color var(--t),color var(--t),transform 160ms var(--ease-out)}
button:active:not(:disabled):not(.lk){transform:scale(.97)}
button:hover{background:var(--hov);border-color:var(--lin-forte)}
button.pri{background:var(--lar);border-color:var(--lar);color:var(--on-pri)}
button.pri:hover{background:var(--lar2);border-color:var(--lar2)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
[data-tema="escuro"] button.ok{color:#0F1A14}
button.er{color:var(--er);border-color:var(--er-borda)}
button.lk{border:0;background:none;color:var(--link);padding:0 var(--s1);height:auto}
button.lk:hover{background:none;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
button .ti{font-size:17px}
button.ic{width:36px;padding:0;justify-content:center}
input,select,textarea{border:1px solid var(--lin);border-radius:var(--r2);padding:0 10px;height:38px;background:var(--sup);width:100%;transition:border-color var(--t),box-shadow var(--t)}
textarea{min-height:76px;resize:vertical;padding:var(--s2) 10px;height:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lar);box-shadow:var(--foco)}
button:focus-visible,a:focus-visible,.tabs button:focus-visible{outline:2px solid var(--lar);outline-offset:2px}
label{font-size:12.5px;color:var(--sec);display:block;margin-bottom:var(--s1);font-weight:500}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--lar)}
/* casca: menu lateral + topo */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;transition:grid-template-columns var(--t)}
.side{background:var(--sup);border-right:1px solid var(--lin);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .marca{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--lin2);text-align:center}
.side .marca img{width:112px;display:block;margin:0 auto}
.side .marca small{display:block;color:var(--mut);font-size:11.5px;margin-top:var(--s2);letter-spacing:.06em;text-transform:uppercase}
.side nav{padding:var(--s2) var(--s3) var(--s5);flex:1}
.side .grp{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;padding:var(--s4) 10px 6px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;color:var(--txt2);text-decoration:none;padding:var(--s2) 10px;border-radius:var(--r2);font-size:14px;font-weight:500;position:relative;transition:background var(--t),color var(--t)}
.side a .ti{font-size:19px;color:var(--mut);flex:0 0 auto}
.side a:hover{background:var(--hov)}
.side a.at{background:var(--larf);color:var(--lar2)}
.side a.at .ti{color:var(--lar)}
.side a.at::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--lar)}
.side .rod{padding:var(--s3) var(--s5);border-top:1px solid var(--lin2);font-size:11.5px;color:var(--mut)}
/* menu recolhido (desktop) */
.app.mini{grid-template-columns:68px minmax(0,1fr)}
.app.mini .side .marca{padding:var(--s4) var(--s2)}.app.mini .side .marca img{width:44px}.app.mini .side .marca small,.app.mini .side .grp,.app.mini .side .rod,.app.mini .side a span{display:none}
.app.mini .side nav{padding:var(--s2)}.app.mini .side a{justify-content:center;padding:10px 0}.app.mini .side a.at::before{left:-8px}
.app.mini .side .grp+a{margin-top:var(--s3)}
.main{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:60px;background:var(--sup);border-bottom:1px solid var(--lin);position:sticky;top:0;z-index:20}
.top .obra{display:flex;align-items:center;gap:10px;min-width:0}
.top .obra .cod{background:var(--graf);color:#fff;font-weight:600;font-size:12.5px;padding:3px 8px;border-radius:var(--r1);letter-spacing:.04em}
[data-tema="escuro"] .top .obra .cod{background:var(--neu)}
.top select{width:auto;max-width:440px;border:1px solid transparent;font-weight:600;font-size:15px;padding:0 28px 0 var(--s2);height:36px;background-color:transparent;cursor:pointer}
.top select:hover{border-color:var(--lin)}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--larf);color:var(--lar2);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.user .nm{line-height:1.2;font-size:13px}.user .nm small{display:block;color:var(--mut);font-size:11.5px}
.menu-btn{display:inline-flex}
/* utilitários */
.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:2px 9px;border-radius:var(--rf);font-size:12px;font-weight:500;background:var(--neu);color:var(--txt2);white-space:nowrap}
.b-ok{background:var(--okf);color:var(--ok)}.b-av{background:var(--avf);color:var(--av)}.b-er{background:var(--erf);color:var(--er)}.b-az{background:var(--azf);color:var(--az)}.b-la{background:var(--larf);color:var(--lar2)}
.cont{padding:var(--s5) var(--s6) 40px;max-width:1560px;width:100%;animation:entra var(--t)}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pghead{display:flex;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}

function erro(e) {

  let m = (e && e.message) || String(e);
  if (e && e.code === '23505') m = m.includes('rdo_obra_id_data') ? 'Já existe RDO desta obra nesta data.' : m.includes('medicoes_obra_id_numero') ? 'Já existe medição com este número.' : 'Registro duplicado.';
  else if (m.includes('row-level security') || (e && e.code === '42501')) m = 'Seu perfil não tem permissão para esta ação.';
  else if (m.includes('Failed to fetch') || m.includes('NetworkError')) m = 'Sem conexão com o servidor.';
  else if (e && e.code === '23503') m = 'Registro em uso por outros lançamentos; não pode ser excluído.';
  toast(m, 'erro');
}
function modal(titulo, corpo, botoes = []) {
  const o = document.createElement('div'); o.className = 'ovl';
  o.innerHTML = `<div class="mdl" role="dialog" aria-label="${h(titulo)}"><h2 style="margin-top:0">${h(titulo)}</h2><div class="mb"></div><div class="acts"></div></div>`;
  const mb = $('.mb', o); if (typeof corpo === 'string') mb.innerHTML = corpo; else mb.appendChild(corpo);
  const acts = $('.acts', o);
  const fechar = () => o.remove();
  botoes.forEach(b => {
    if (b === '|') { const s = document.createElement('span'); s.className = 'sp'; acts.appendChild(s); return; }
    const x = document.createElement('button'); x.textContent = b.t; if (b.c) x.className = b.c;
    x.onclick = async () => { x.disabled = true; try { const r = await b.f(o); if (r !== false) fechar(); } catch (e) { erro(e); } finally { x.disabled = false; } };
    acts.appendChild(x);

  const c = document.createElement('button'); c.textContent = 'Fechar'; c.onclick = fechar; acts.appendChild(c);
  o.addEventListener('mousedown', ev => { if (ev.target === o) fechar(); });
  document.body.appendChild(o);
  const f = $('input,select,textarea', mb); if (f) f.focus();
  return o;
}

  if (opt.extra) aoa.push([], ...opt.extra);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = head.map((c, i) => ({ wch: Math.min(60, Math.max(9, ...[c, ...body.map(r => r[i])].map(v => typeof v === 'number' ? 14 : String(v ?? '').length + 2))) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: r0, c: 0 }, e: { r: r0 + body.length, c: head.length - 1 } }) };
  for (let r = r0 + 1; r < aoa.length; r++) for (let c = 0; c < head.length; c++) {
    const cell = ws[XLSX.utils.encode_cell({ r, c })];
    if (cell && cell.t === 'n') cell.z = (opt.fmt && opt.fmt[c]) || '#,##0.00';
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, titulo.replace(/[\\/?*[\]:]/g, '').slice(0, 31));
  XLSX.writeFile(wb, arq(doc, 'xlsx'));
}

      if (S.obra.contratante) doc.text(`Contratante: ${S.obra.contratante}`.slice(0, 95), P.W - P.M, 11.5, { align: 'right' });
      doc.setDrawColor(249, 84, 20); doc.setLineWidth(0.6); doc.line(P.M, 26.5, P.W - P.M, 26.5);
      doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(P.M, P.H - 11, P.W - P.M, P.H - 11);
      doc.setFontSize(8); doc.setTextColor(90);
      doc.text(`Emitido em ${agora()} por ${S.me.nome || S.me.email}`, P.M, P.H - 7);
      doc.text(`Página ${i} de ${n}`, P.W - P.M, P.H - 7, { align: 'right' });
      doc.setTextColor(0);
    }
    doc.save(arq(nome, 'pdf'));
  };
  return P;
}
function tabelaPdf(doc, titulo, head, body, opt = {}) {

async function imgDataUrl(url) {

async function reduzImg(dataUrl, max = 1400) {
  return new Promise(ok => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok({ url: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height }); }; im.onerror = () => ok(null); im.src = dataUrl; });
}

function valCel(c, r, bruto) {
  let v = c.v ? c.v(r) : r[c.k];
  if (bruto) {
    if (['num', 'money'].includes(c.t)) return num(v);
    if (c.t === 'sel') return (c.o && c.o[v]) || v || '';
    if (c.t === 'date') return dt(v);
    if (c.t === 'bool') return v ? 'Sim' : 'Não';
    if (c.t === 'ref') return (c._map && c._map[v]) || '';
    return v ?? '';
  }
  if (c.t === 'num') return nf(v, c.d ?? 2);
  if (c.t === 'money') return brl(v);
  if (c.t === 'date') return dt(v);
  if (c.t === 'sel') return c.badge ? badge(v, c.o) : h((c.o && c.o[v]) || v || '');
  if (c.t === 'bool') return v ? 'Sim' : 'Não';
  if (c.t === 'ref') return h((c._map && c._map[v]) || '');
  if (c.html) return v ?? '';
  return h(v ?? '');
}

function curvaS(D, K) {
  if (!$('#cS')) return;
  const datasEap = D.eap.flatMap(a => [a.inicio_previsto, a.fim_previsto]).filter(Boolean);
  const datasReal = [...D.serv.map(s => s.rdo && s.rdo.data), ...D.cbuq.map(c => c.data)].filter(Boolean);
  const todas = [...datasEap, ...datasReal, hoje()].sort();
  if (todas.length < 2 || todas[0] === todas[todas.length - 1]) { $('#cSm').textContent = 'Cadastre as datas previstas da EAP em Planejamento para gerar a curva.'; return; }
  const ini = todas[0], fim = todas[todas.length - 1]; const pts = []; let d = ini;
  const passo = Math.max(1, Math.ceil((new Date(fim) - new Date(ini)) / 864e5 / 40));
  while (d < fim) { pts.push(d); d = addDias(d, passo); } pts.push(fim); if (!pts.includes(hoje())) { pts.push(hoje()); pts.sort(); }
  const prev = pts.map(x => previstoEap(D.eap, K.itensMap, x));
  const itens = D.itens.filter(i => Number(i.qtd_contratada) > 0); const sw = soma(itens, i => K.temPreco ? i.valor_contratado : 1);
  const ev = []; D.serv.forEach(s => s.rdo && s.orcamento_item_id && ev.push([s.rdo.data, s.orcamento_item_id, Number(s.quantidade) || 0]));
  D.cbuq.forEach(c => { const it = K.itensMap[c.orcamento_item_id]; if (it) ev.push([c.data, c.orcamento_item_id, String(it.unidade).toLowerCase() === 't' ? Number(c.massa_teorica) : Number(c.area)]); });
  ev.sort((a, b) => a[0] < b[0] ? -1 : 1);
  const real = pts.map(x => {
    if (x > hoje() || !sw) return null; const acc = {};
    ev.forEach(([d2, i, qd]) => { if (d2 <= x) acc[i] = (acc[i] || 0) + qd; });
    return 100 * soma(itens, i => (K.temPreco ? i.valor_contratado : 1) * Math.min(1, (acc[i.id] || 0) / i.qtd_contratada)) / sw;
  });
  const pEap = pts.map(x => x === hoje() ? K.fisEap : null);
  grafico($('#cS'), {
    type: 'line', data: { labels: pts.map(dt), datasets: [
      { label: 'Planejado (EAP)', data: prev, borderColor: cor('--sec'), borderDash: [5, 4], pointRadius: 0, tension: .25 },
      { label: 'Executado (itens do orçamento)', data: real, borderColor: cor('--lar'), backgroundColor: cor('--lar'), pointRadius: 0, tension: .25, spanGaps: true },
      { label: 'Realizado EAP (hoje)', data: pEap, borderColor: cor('--az'), backgroundColor: cor('--az'), pointRadius: 6, showLine: false }
    ] }, options: { maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }, plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${nf(c.parsed.y, 1)}%` } } } }
  });
  $('#cSm').textContent = 'Planejado: distribuição linear das atividades da EAP entre início e fim previstos. Executado: memória de cálculo diária e produção de CBUQ sobre o contratado.';
}
function histograma(D, cid) {
  if (!$('#' + cid)) return;
  const porDia = {}; D.efet.forEach(e => { const d = e.rdo && e.rdo.data; if (d) porDia[d] = (porDia[d] || 0) + e.quantidade; });
  const prevMes = {}; D.hprev.forEach(p => { const m = p.mes.slice(0, 7); prevMes[m] = (prevMes[m] || 0) + p.quantidade; });
  const datas = [...Object.keys(porDia)]; const meses = Object.keys(prevMes).sort();
  if (meses.length) { datas.push(meses[0] + '-01'); const u = meses[meses.length - 1]; const f = new Date(+u.slice(0, 4), +u.slice(5, 7), 0).toISOString().slice(0, 10); datas.push(f); }
  datas.sort(); if (!datas.length) { $('#' + cid).parentNode.innerHTML = '<p class="muted">Sem efetivo lançado no RDO nem histograma previsto (Planejamento).</p>'; return; }
  const lab = []; for (let d = datas[0]; d <= datas[datas.length - 1]; d = addDias(d, 1)) lab.push(d);

function gantt(box, rows) {
  const at = rows.filter(r => r.inicio_previsto || r.inicio_real);
  if (!at.length) { box.innerHTML = '<p class="muted">Cadastre datas previstas nas atividades para ver o cronograma.</p>'; return; }
  const ds = at.flatMap(a => [a.inicio_previsto, a.fim_previsto, a.inicio_real, a.fim_real]).filter(Boolean).concat([hoje()]).sort();
  const t0 = new Date(ds[0] + 'T00:00:00').getTime(), t1 = new Date(addDias(ds[ds.length - 1], 1) + 'T00:00:00').getTime();
  const pos = d => 100 * (new Date(d + 'T00:00:00').getTime() - t0) / (t1 - t0);
  const meses = []; for (let x = new Date(ds[0].slice(0, 7) + '-01T00:00:00'); x.getTime() < t1; x.setMonth(x.getMonth() + 1)) meses.push(x.toISOString().slice(0, 10));
  box.innerHTML = `<div class="card"><h3 style="margin-top:0">Cronograma (Gantt)</h3><div class="gantt"><div class="esc"><div></div><div style="position:relative;height:18px">${meses.map(m => `<span style="position:absolute;left:${Math.max(0, pos(m))}%">${m.slice(5, 7)}/${m.slice(2, 4)}</span>`).join('')}</div></div>
  ${at.map(a => { const i = a.inicio_previsto || a.inicio_real, f = a.fim_previsto || a.fim_real || i;
    return `<div class="row"><div class="nm" title="${h(a.nome)}">${h(a.codigo || '')} ${h(a.nome)}</div><div class="tr">${a.status === 'marco' && i === f ? `<div class="mk" style="left:calc(${pos(i)}% - 6px)" title="${dt(i)}"></div>` : `<div class="pl" style="left:${pos(i)}%;width:${Math.max(0.6, pos(addDias(f, 1)) - pos(i))}%" title="${dt(i)} a ${dt(f)} · ${nf((a.percentual ?? a.percentual_executado), 0)}%"><i style="width:${Number((a.percentual ?? a.percentual_executado)) || 0}%"></i></div>`}<div class="hj" style="left:${pos(hoje())}%"></div></div></div>`; }).join('')}</div><p class="muted">Barra cinza: previsto. Laranja: % executado. Linha azul: hoje.</p></div>`;
}

/* ================= GRADE EDITÁVEL ================= */
function grade(box, defs, dados, ro, onCh) {
  { const nb = box.cloneNode(false); box.replaceWith(nb); box = nb; }
  let linhas = dados.map(d => ({ ...d }));
  const cel = (d, r, i) => {
    const v = r[d.k] ?? '', dis = ro ? 'disabled' : '';
    if (d.t === 'sel') return `<select data-i="${i}" data-k="${d.k}" ${dis}><option value=""></option>${d.o.map(([k, l]) => `<option value="${h(k)}" ${String(v) === String(k) ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>`;
    if (d.t === 'bool') return `<input type="checkbox" data-i="${i}" data-k="${d.k}" ${v ? 'checked' : ''} ${dis} style="width:auto">`;
    if (d.t === 'num') return `<input type="number" step="any" inputmode="decimal" data-i="${i}" data-k="${d.k}" value="${h(v)}" ${dis} style="min-width:${d.w || 80}px">`;
    return `<input data-i="${i}" data-k="${d.k}" value="${h(v)}" ${dis} ${d.list ? `list="gl_${d.k}"` : ''} style="min-width:${d.w || 110}px">`;
  };
  const desenhar = () => {
    box.innerHTML = `<div class="tw"><table class="grid"><thead><tr>${defs.map(d => `<th class="${d.t === 'num' ? 'n' : ''}">${h(d.l)}</th>`).join('')}${ro ? '' : '<th></th>'}</tr></thead><tbody>${linhas.map((r, i) => `<tr>${defs.map(d => `<td class="ed">${cel(d, r, i)}</td>`).join('')}${ro ? '' : `<td class="ed"><button class="lk er" data-del="${i}" aria-label="Remover linha">Remover</button></td>`}</tr>`).join('') || `<tr><td colspan="${defs.length + 1}" class="vazio">Nenhuma linha.</td></tr>`}</tbody></table></div>${ro ? '' : '<button class="add" style="margin-top:6px">Adicionar linha</button>'}${defs.filter(d => d.list).map(d => `<datalist id="gl_${d.k}">${d.list.map(x => `<option value="${h(x)}">`).join('')}</datalist>`).join('')}`;
  };
  desenhar();
  box.addEventListener('input', e => { const t = e.target, i = t.dataset.i; if (i === undefined) return; const d = defs.find(x => x.k === t.dataset.k); linhas[i][t.dataset.k] = d.t === 'bool' ? t.checked : d.t === 'num' ? (t.value === '' ? null : Number(t.value)) : (t.value || null); if (onCh && onCh(linhas[i], t.dataset.k)) { const foc = t.dataset.k; desenhar(); const n = $(`[data-i="${i}"][data-k="${foc}"]`, box); if (n) { n.focus(); if (n.setSelectionRange && n.type === 'text') n.setSelectionRange(n.value.length, n.value.length); } } });
  box.addEventListener('change', e => { const t = e.target; if (t.tagName === 'SELECT' || t.type === 'checkbox') t.dispatchEvent(new Event('input', { bubbles: true })); });
  box.addEventListener('click', e => { if (e.target.dataset.del !== undefined) { linhas.splice(+e.target.dataset.del, 1); desenhar(); } else if (e.target.classList.contains('add')) { linhas.push({}); desenhar(); } });
  return { get: () => linhas.filter(r => Object.values(r).some(v => v !== null && v !== '' && v !== false)), set: (a) => { linhas = a.map(x => ({ ...x })); desenhar(); } };
}

async function medDados(id) {
  const [m, itens, mi, docs] = await Promise.all([
    q(sb.from('medicoes').select('*').eq('id', id).single()),
    q(sb.from('vw_itens_saldo').select('*').eq('obra_id', S.obra.id).order('ordem')),
    q(sb.from('medicao_itens').select('*, med:medicao_id(numero)').eq('obra_id', S.obra.id)),
    q(sb.from('medicao_documentos').select('*').eq('medicao_id', id).order('ordem'))
  ]);
  const L2 = itens.map(i => {
    const doItem = mi.filter(x => x.orcamento_item_id === i.id);
    const anterior = soma(doItem.filter(x => x.med && x.med.numero < m.numero), x => x.quantidade - x.quantidade_glosada);
    const atual = doItem.find(x => x.medicao_id === id);
    return { i, anterior, atual, q: atual ? Number(atual.quantidade) : 0, g: atual ? Number(atual.quantidade_glosada) : 0, mem: atual ? (atual.memoria || '') : '' };
  });
  return { m, linhas: L2, docs };
}

      <td class="n">${nf(ac)}</td><td class="n">${nf(sd)}</td><td class="n">${brl((l.q - l.g) * (Number(i.preco_unitario) || 0))}</td><td class="ed"><textarea data-k="${k}" data-c="mem" ${ro ? 'disabled' : ''} style="min-height:34px;min-width:240px;font-size:12px">${h(l.mem)}</textarea></td></tr>`; }).join('') || '<tr><td colspan="12" class="vazio">Orçamento sem itens.</td></tr>';

  };
  tb.addEventListener('input', e => { const t = e.target, k = t.dataset.k; if (k === undefined) return; const l = D.linhas[k]; if (t.dataset.c === 'mem') l.mem = t.value; else { l[t.dataset.c] = t.value === '' ? 0 : Number(t.value); const tr = t.closest('tr'), i = l.i, ac = l.anterior + l.q - l.g, sd = i.qtd_contratada == null ? null : i.qtd_contratada - ac; tr.children[8].textContent = nf(ac); tr.children[9].textContent = nf(sd); tr.children[10].textContent = brl((l.q - l.g) * (Number(i.preco_unitario) || 0)); tr.style.background = sd !== null && sd < -1e-6 ? 'var(--erf)' : ''; totais(); } });

/* calcula quantidade e fórmula de uma linha de memória conforme a unidade do item */
function calcMemoria(l, it) {
  const u = String(it ? it.unidade : '').toLowerCase().replace('2', '²').replace('3', '³');
  const a = estM(l.est_ini_int, l.est_ini_frac), b = estM(l.est_fim_int, l.est_fim_frac);
  let comp = l.comprimento;
  if (a !== null && b !== null) comp = Math.round((b - a) * 100) / 100;
  const r = { comprimento: comp }; let q = null, f = '';
  const est = a !== null && b !== null ? `Est. ${estTxt(l.est_ini_int, l.est_ini_frac)} a ${estTxt(l.est_fim_int, l.est_fim_frac)}${l.lado ? ' ' + l.lado : ''}: ` : '';
  if (u === 'm' && comp) { q = comp; f = `${est}${nf(comp)} m`; }
  else if (u === 'm²' && comp && l.largura) { q = comp * l.largura; f = `${est}${nf(comp)} m × ${nf(l.largura)} m = ${nf(q)} m²`; }
  else if (u === 'm³' && l.n_viagens && l.cap_viagem) { q = l.n_viagens * l.cap_viagem; f = `${est}${nf(l.n_viagens, 0)} viagens × ${nf(l.cap_viagem)} m³ = ${nf(q)} m³`; }
  else if (u === 'm³' && comp && l.largura && l.espessura) { q = comp * l.largura * l.espessura; f = `${est}${nf(comp)} × ${nf(l.largura)} × ${nf(l.espessura, 3)} m = ${nf(q, 3)} m³`; }
  else if (u === 't' && comp && l.largura && l.espessura) { q = comp * l.largura * l.espessura * 2.4; f = `${est}${nf(comp)} × ${nf(l.largura)} × ${nf(l.espessura, 3)} m × 2,40 t/m³ = ${nf(q, 3)} t`; }
  if (q !== null) { r.quantidade = Math.round(q * 10000) / 10000; r.formula = f; }
  else r.formula = l.quantidade != null ? `${est}${nf(l.quantidade)} ${it ? it.unidade : ''} (informado)` : '';
  return r;
}

async function levantarPendencias(obras) {
  const ids = obras.map(o => o.id); const hj = hoje(), em15 = addDias(hj, 15), ha15 = addDias(hj, -15);

    pegar('equipamentos', 'id,obra_id,prefixo,descricao,horimetro_atual,observacao,status'), pegar('equipamentos_custo', 'equipamento_id,obra_id,custo_hora'),
    pegar('funcionarios', 'id,obra_id,nome,aso_validade,epi_entregue,ativo'),
    pegar('rdo', 'id,obra_id,data,status', p => p.gte('data', addDias(hj, -60))), pegar('abastecimentos', 'id,obra_id,valor', p => p.or('valor.is.null,valor.eq.0')),
    pegar('custos', 'id,obra_id,data,categoria,descricao,valor,anexo_caminho', p => p.is('anexo_caminho', null)),
    pegar('medicao_documentos', 'id,obra_id,documento,entregue,medicao:medicoes(numero,status)', p => p.eq('entregue', false)),
    pegar('pendencias', '*', p => p.in('status', ['aberta', 'em_andamento', 'a_confirmar']).neq('tipo', 'informado')),
    q(sb.from('contatos').select('*')).catch(() => []), q(sb.from('certidoes').select('*')).catch(() => [])]);
  const it = [];
  const add = (o, area, chave, info, detalhe, prio, link, quem) => it.push({ obra: o, area, chave, info, detalhe: detalhe || '', prio, link, quem });
  for (const o of obras) {
    const por = arr => arr.filter(x => x.obra_id === o.id);
    [['contrato_numero', 'Nº do contrato', 1], ['data_os', 'Data da Ordem de Serviço', 1], ['prazo_dias', 'Prazo contratual (dias)', 1], ['valor_contrato', 'Valor do contrato', 1], ['data_inicio', 'Data de início da obra', 2], ['data_fim_prevista', 'Término previsto', 2], ['contratante', 'Contratante', 2]]
      .forEach(([k, l, p]) => { if (o[k] == null || o[k] === '') add(o, 'contrato', `obra.${k}`, l, 'Cadastro da obra em branco', p, 'obras'); });
    por(docs).forEach(d => add(o, 'documentos', `doc.${d.id}`, d.documento, L.status_doc[d.status] || d.status, 2, 'obras'));
    const its = por(itens).filter(i => i.ativo !== false);
    if (!its.length) add(o, 'orcamento', 'orc.vazio', 'Planilha orçamentária vencedora (Excel)', 'Sem orçamento carregado: medição e memória de cálculo não funcionam', 1, 'orcamento');
    else { const sp = its.filter(i => i.preco_unitario == null).length; if (sp) add(o, 'orcamento', 'orc.preco', `Preço unitário de ${sp} item(ns)`, 'Itens sem preço na planilha', 2, 'orcamento'); }
    if (!por(eap).length) add(o, 'planejamento', 'eap.vazio', 'Cronograma físico (EAP e prazos por frente)', 'Sem planejamento: curva S e histograma previsto ficam vazios', 2, 'planejamento');
    const e = por(eqs);

      const ch = new Set(por(eqc).filter(x => x.custo_hora != null).map(x => x.equipamento_id)); const sc = e.filter(x => !ch.has(x.id)); if (sc.length) add(o, 'frota', 'frota.custo', `Custo horário de ${sc.length} equipamento(s)`, 'Próprio: custo/h; locado: valor do contrato de locação e franquia', 3, 'equipamentos', 'Gestor do contrato');

    if (falta.length) add(o, 'rdo', 'rdo.falta', `RDO de ${falta.length} dia(s) (últimos ${DIAS_RDO} dias)`, falta.map(d => dt(d).slice(0, 5)).join(', '), 1, 'rdo');
    const env = rd.filter(x => x.status === 'enviado'); if (env.length) add(o, 'aprovacao', 'rdo.aprov', `Aprovação de ${env.length} RDO(s)`, env.map(x => dt(x.data).slice(0, 5)).join(', '), 2, 'rdo');

    const sc = por(custos); if (sc.length) add(o, 'custos', 'custo.comp', `Comprovante de ${sc.length} lançamento(s) de custo`, `${brl(soma(sc, x => x.valor))} sem nota/recibo anexado`, 2, 'custos');
    por(medd).filter(x => !x.medicao || x.medicao.status !== 'aprovada').forEach(x => add(o, 'medicao', `med.${x.id}`, x.documento, `Medição nº ${x.medicao ? x.medicao.numero : '?'}`, 1, 'medicao'));

  const o0 = obras.find(o => o.id === S.obra.id) || obras[0];
  const TIPOS_CERT = ['CRF (FGTS)', 'INSS / Federal', 'Municipal', 'Trabalhista (CNDT)', 'Estadual'];
  if (!cert.length) add(o0, 'certidoes', 'cert.vazio', 'Certidões negativas da empresa', TIPOS_CERT.join(', '), 1, 'obras');
